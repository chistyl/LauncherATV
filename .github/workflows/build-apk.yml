name: Build CleanYourTV V12 APK

on:
  workflow_dispatch:
  push:
    branches: [ cleanyourtv-v12 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4

      - name: Reassemble V12 source archive
        run: |
          set -euo pipefail
          test -f CleanYourTV-V12-source.zip.part01
          test -f CleanYourTV-V12-source.zip.part02
          cat CleanYourTV-V12-source.zip.part01 CleanYourTV-V12-source.zip.part02 > /tmp/CleanYourTV-V12-source.zip
          unzip -tq /tmp/CleanYourTV-V12-source.zip
          mkdir -p /tmp/v12-source
          unzip -q /tmp/CleanYourTV-V12-source.zip -d /tmp/v12-source
          test -f /tmp/v12-source/cleanyourtv-main/launcher/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build CleanYourTV V12 debug APK
        working-directory: /tmp/v12-source/cleanyourtv-main/launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-V12-debug
          path: /tmp/v12-source/cleanyourtv-main/launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
